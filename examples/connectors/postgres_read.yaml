format_version: "0.2"
pipeline:
  name: nomos_postgres_read
  network: allow
  secrets: [NOMOS_POSTGRES_DSN]
  input:
    sql: "SELECT %s::text AS greeting, current_timestamp AS at"
    params: ["Hello from Nomos"]
    max_rows: 100
    statement_timeout_ms: 10000
  steps:
    - id: query
      plugin: postgres_read
      timeout: 30s
