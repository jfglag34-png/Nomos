[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-outreach"
version = "0.1.0"
description = "Production-oriented Telegram outreach platform with clean architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Telegram Outreach" }]
license = { text = "MIT" }
dependencies = [
    "telethon>=1.36,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<25.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.2,<9.0",
    "click>=8.1,<9.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "freezegun>=1.4,<2.0",
    "respx>=0.21,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.scripts]
telegram-outreach = "telegram_outreach.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
