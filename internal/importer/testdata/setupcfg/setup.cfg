[metadata]
name = cfg-only-tool
version = 0.9.1
description = Проект без pyproject.toml: запасной путь через setup.cfg
long_description = file: README.md

[options]
python_requires = >=3.9
packages = find:
install_requires =
    requests>=2.31,<3.0
    certifi==2024.2.2

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cfg-tool = cfg_only.main:main_cli

[options.extras_require]
dev =
    pytest>=8.0
    mypy>=1.10
