tests:
- name: invalid JSON
  input_raw: '{broken'
  expect:
    exit_code: 2
- name: token required
  env:
    NOMOS_TELEGRAM_TOKEN: ''
  input:
    text: hello
  expect:
    status: error
    exit_code: 1
    error:
      code: no_token
      retryable: false
- name: mutually exclusive message and document
  env:
    NOMOS_TELEGRAM_TOKEN: 123:offline_fixture
    NOMOS_TELEGRAM_CHAT_ID: '42'
  input:
    text: x
    document_base64: eA==
  expect:
    status: error
    exit_code: 1
    error:
      code: bad_input
      retryable: false
